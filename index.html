
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLEM SI TUA BANGKA</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: white;
}

body::before {
  content: "";
  position: fixed;
  inset: -50%;
  background: conic-gradient(
    red, orange, yellow, lime, cyan,
    blue, violet, magenta, red
  );
  animation: spin 5s linear infinite;
  filter: blur(90px);
  opacity: .45;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.container {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 20px;
  width: 100%;
}

h1 {
  font-size: clamp(35px, 9vw, 85px);
  font-weight: 1000;
  line-height: 1.3;
  background: linear-gradient(
    90deg, red, orange, yellow, lime,
    cyan, blue, violet, red
  );
  background-size: 400%;
  -webkit-background-clip: text;
  color: transparent;
  animation: rainbow 2s linear infinite,
             shake .15s infinite;
  filter: drop-shadow(0 0 15px cyan);
}

@keyframes rainbow {
  to { background-position: 400%; }
}

@keyframes shake {
  0% { transform: translate(0,0); }
  25% { transform: translate(2px,-2px); }
  50% { transform: translate(-2px,2px); }
  75% { transform: translate(2px,2px); }
  100% { transform: translate(0,0); }
}

.subtitle {
  font-size: 20px;
  margin-top: 25px;
  color: white;
  text-shadow: 0 0 10px cyan, 0 0 25px magenta;
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  to { transform: scale(1.1); }
}

button {
  margin-top: 30px;
  padding: 14px 28px;
  border: 2px solid white;
  border-radius: 30px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  background: linear-gradient(90deg, red, purple, blue);
  box-shadow: 0 0 20px cyan;
  cursor: pointer;
}

.particle {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  pointer-events: none;
  animation: float 5s linear forwards;
  z-index: 1;
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(720deg);
    opacity: 0;
  }
}

#flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  animation: flash 3s infinite;
}

@keyframes flash {
  0%, 100% { background: transparent; }
  50% { background: rgba(255,0,255,.08); }
}
</style>
</head>

<body>
<div id="flash"></div>

<div class="container">
  <h1>POLEM<br>SI TUA<br>BANGKA!</h1>

  <div class="subtitle">
    🔥 RAINBOW MODE ACTIVATED 🔥
    <br><br>
    WKWKWK 😂
  </div>

  <button onclick="playMusic()">
    🔊 PUTAR MUSIK REMIX
  </button>
</div>

<audio id="music" loop>
  <source src="remix.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("music");

function playMusic() {
  music.play().catch(() => {
    alert("Tambahkan file remix.mp3 ke folder HTML!");
  });
}

// Partikel rainbow
const symbols = ["🔥","😂","🌈","💀","⚡","✨"];

setInterval(() => {
  const p = document.createElement("div");
  p.className = "particle";
  p.textContent = symbols[
    Math.floor(Math.random() * symbols.length)
  ];

  p.style.left = Math.random() * 100 + "vw";
  p.style.color = `hsl(${Math.random()*360},100%,60%)`;
  p.style.fontSize = (15 + Math.random()*30) + "px";

  document.body.appendChild(p);

  setTimeout(() => p.remove(), 5000);
}, 150);
</script>
</body>
</html>
